<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Squircle (Apple/modern UI style) -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>

  <!-- Bold Stylized Letter 'A' of AYMARD -->
  <g filter="url(#glow)" fill="url(#goldGrad)">
    <path d="
      M 216 108
      L 296 108
      L 426 388
      L 348 388
      L 312 308
      L 200 308
      L 164 388
      L 86 388
      Z
      M 256 178
      L 222 254
      L 290 254
      Z
    " fill-rule="evenodd"/>
  </g>

  <!-- Subtle luxury brand mark -->
  <circle cx="256" cy="428" r="6" fill="#ffffff" opacity="0.95"/>
  <circle cx="230" cy="428" r="3.5" fill="#ffffff" opacity="0.35"/>
  <circle cx="282" cy="428" r="3.5" fill="#ffffff" opacity="0.35"/>
</svg>