<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#020202"/>
    </linearGradient>

    <!-- Sneaker Upper (Crisp Pure White) -->
    <linearGradient id="shoeWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Background Shoe (Shadow / 2nd shoe of the pair) -->
    <linearGradient id="backShoe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Luxury Gold/Orange Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Midsole Gradient -->
    <linearGradient id="midsoleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.75"/>
    </filter>
  </defs>

  <!-- Squircle Base with Luxury Border -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none" stroke="url(#goldGradient)" stroke-width="2" opacity="0.35"/>

  <!-- BACK SNEAKER (Pair Effect - slightly offset behind) -->
  <g opacity="0.45" transform="translate(18, -32) scale(0.96)">
    <!-- Back shoe sole -->
    <path d="M 85 352 C 85 352, 105 365, 175 365 L 375 365 C 405 365, 428 355, 430 342 L 95 328 C 85 328, 83 340, 85 352 Z" fill="#0f172a"/>
    <!-- Back shoe midsole -->
    <path d="M 88 332 L 420 332 C 424 320, 416 310, 398 308 L 338 306 C 318 306, 298 312, 258 312 L 168 312 C 138 312, 108 306, 96 314 C 88 320, 88 326, 88 332 Z" fill="#64748b"/>
    <!-- Back shoe body -->
    <path d="M 98 314 C 96 292, 104 242, 136 222 C 156 210, 176 232, 200 240 L 244 184 C 252 174, 268 172, 278 180 L 288 188 C 286 202, 278 224, 276 240 L 336 258 C 372 268, 392 286, 396 308 Z" fill="url(#backShoe)"/>
    <!-- Back shoe swoosh/stripe -->
    <path d="M 120 286 C 175 286, 225 256, 295 232 C 330 220, 365 242, 390 282 C 360 262, 320 250, 280 260 C 215 276, 170 306, 120 286 Z" fill="#94a3b8"/>
  </g>

  <!-- FOREGROUND MAIN SNEAKER -->
  <g filter="url(#shadow)" transform="translate(0, 12)">
    <!-- Sole Tread / Bottom Base -->
    <path d="M 90 354 
             C 90 354, 112 368, 185 368 
             L 380 368 
             C 412 368, 436 356, 438 342 
             L 100 328 
             C 88 328, 86 341, 90 354 Z" 
          fill="#0f172a"/>

    <!-- Thick Chunky Midsole with Flex Grooves -->
    <path d="M 94 332 
             L 426 332 
             C 430 320, 420 310, 402 308 
             L 342 305 
             C 322 305, 302 312, 262 312 
             L 172 312 
             C 140 312, 110 306, 96 314 
             C 88 321, 88 327, 94 332 Z" 
          fill="url(#midsoleGrad)"/>

    <!-- Air Bubble Cushions (Luxury Gold) -->
    <rect x="135" y="320" width="42" height="7" rx="3.5" fill="url(#goldGradient)"/>
    <rect x="187" y="320" width="34" height="7" rx="3.5" fill="url(#goldGradient)"/>

    <!-- Upper Body (Premium White Leather) -->
    <path d="M 102 314 
             C 100 292, 108 242, 140 222 
             C 160 210, 180 232, 204 240 
             L 248 184 
             C 256 174, 272 172, 282 180 
             L 292 188 
             C 290 202, 282 224, 280 240 
             L 340 258 
             C 376 268, 398 286, 402 308 
             L 102 314 Z" 
          fill="url(#shoeWhite)"/>

    <!-- Dynamic Luxury Gold Swoosh / Stripe Accent -->
    <path d="M 125 288 
             C 180 288, 230 258, 300 233 
             C 335 221, 372 243, 396 283 
             C 366 263, 326 251, 286 261 
             C 220 277, 175 308, 125 288 Z" 
          fill="url(#goldGradient)"/>

    <!-- Inner Ankle Collar & Tongue Padding -->
    <path d="M 154 218 
             C 164 196, 194 196, 208 228 
             L 246 188 
             C 242 180, 232 178, 222 184 
             L 186 206 
             C 172 208, 160 212, 154 218 Z" 
          fill="#1e293b"/>

    <!-- Lacing System -->
    <g stroke="#0f172a" stroke-width="5" stroke-linecap="round">
      <line x1="228" y1="220" x2="254" y2="232"/>
      <line x1="246" y1="236" x2="274" y2="248"/>
      <line x1="264" y1="252" x2="294" y2="262"/>
    </g>

    <!-- Eyelets Accents -->
    <circle cx="254" cy="233" r="3.5" fill="#f59e0b"/>
    <circle cx="274" cy="249" r="3.5" fill="#f59e0b"/>
    <circle cx="294" cy="263" r="3.5" fill="#f59e0b"/>

    <!-- Heel Pull Tab -->
    <path d="M 126 230 C 120 216, 128 200, 140 198 C 146 208, 142 222, 138 228 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Luxury Brand Sparkle -->
  <path d="M 405 85 Q 405 102 422 102 Q 405 102 405 119 Q 405 102 388 102 Q 405 102 405 85 Z" fill="url(#goldGradient)"/>
  <circle cx="436" cy="80" r="3" fill="#ffffff" opacity="0.9"/>
</svg>